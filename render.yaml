services:
  - type: web
    name: v-shiroya-policy-ai
    runtime: node
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - key: NVIDIA_PAGE_CONCURRENCY
        value: "2"
      - key: NVIDIA_PDF_SCALE
        value: "2.0833"
      - key: NVIDIA_OCR_TEXT_THRESHOLD
        value: "500"
      - key: NVIDIA_PAGE_TEXT_LIMIT
        value: "30000"
      - key: NVIDIA_FINAL_TEXT_LIMIT
        value: "700000"
      - key: NVIDIA_OCR_MAX_TOKENS
        value: "8192"
      - key: NVIDIA_MAX_TOKENS
        value: "10000"
      - key: NVIDIA_TIMEOUT_MS
        value: "120000"
      - key: NVIDIA_MAX_RETRIES
        value: "3"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_ALLOW_PAID
        value: "false"
      - key: OPENROUTER_MODELS
        value: openrouter/free
      - key: OPENROUTER_FAST_MODE
        value: "true"
      - key: OPENROUTER_USE_PDF_PLUGIN
        value: "false"
      - key: APP_URL
        sync: false
