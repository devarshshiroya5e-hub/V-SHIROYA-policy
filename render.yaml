services:
  - type: web
    name: v-shiroya-policy-ai
    runtime: node
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - key: NVIDIA_OCR_MODEL
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - key: NVIDIA_FINAL_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_PAGE_CONCURRENCY
        value: "3"
      - key: NVIDIA_PDF_SCALE
        value: "1.75"
      - key: NVIDIA_OCR_TEXT_THRESHOLD
        value: "650"
      - key: NVIDIA_PAGE_TEXT_LIMIT
        value: "60000"
      - key: NVIDIA_FINAL_TEXT_LIMIT
        value: "900000"
      - key: NVIDIA_OCR_MAX_TOKENS
        value: "4096"
      - key: NVIDIA_MAX_TOKENS
        value: "9000"
      - key: NVIDIA_RECOVERY_MAX_TOKENS
        value: "5000"
      - key: NVIDIA_TIMEOUT_MS
        value: "90000"
      - key: NVIDIA_MAX_RETRIES
        value: "2"
      - key: AI_CACHE_TTL_MS
        value: "1800000"
      - key: AI_CACHE_MAX_ENTRIES
        value: "20"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_ALLOW_PAID
        value: "false"
      - key: OPENROUTER_MODELS
        value: openrouter/free
      - key: OPENROUTER_FAST_MODE
        value: "true"
      - key: OPENROUTER_USE_PDF_PLUGIN
        value: "false"
      - key: APP_URL
        sync: false
