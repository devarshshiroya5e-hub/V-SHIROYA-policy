services:
  - type: web
    name: v-shiroya-policy-ai
    runtime: node
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_ALLOW_PAID
        value: "true"
      - key: OPENROUTER_MODELS
        value: google/gemini-2.5-flash-lite:nitro
      - key: OPENROUTER_FAST_MODE
        value: "true"
      - key: OPENROUTER_USE_PDF_PLUGIN
        value: "false"
      - key: OPENROUTER_PDF_ENGINE
        value: "native"
      - key: APP_URL
        sync: false
